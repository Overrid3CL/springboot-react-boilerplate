spring.application.name=boilerplate

spring.threads.virtual.enabled=true

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/boilerplate}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:boilerplate}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:boilerplate}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

spring.mvc.problemdetails.enabled=true
server.error.include-stacktrace=never
server.error.include-message=never
server.forward-headers-strategy=framework
server.shutdown=graceful

# Docker Compose solo en desarrollo. El módulo no va dentro del jar de producción.
spring.docker.compose.file=../compose.yaml

app.workos.client-id=${WORKOS_CLIENT_ID:}
app.workos.issuer=${WORKOS_ISSUER:https://api.workos.com}
app.workos.audience=${WORKOS_AUDIENCE:}
app.workos.jwks-uri=${WORKOS_JWKS_URI:}
app.workos.api-hostname=${WORKOS_API_HOSTNAME:}
app.workos.redirect-uri=${WORKOS_REDIRECT_URI:}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.otlp.metrics.export.enabled=${OTLP_METRICS_ENABLED:false}
management.otlp.metrics.export.url=${OTLP_METRICS_URL:http://localhost:4318/v1/metrics}
management.tracing.sampling.probability=${OTEL_TRACES_SAMPLER_ARG:0.1}
management.tracing.export.otlp.enabled=${OTLP_TRACES_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
management.logging.export.otlp.enabled=${OTLP_LOGS_ENABLED:false}
management.opentelemetry.logging.export.otlp.endpoint=${OTLP_LOGS_ENDPOINT:http://localhost:4318/v1/logs}

springdoc.swagger-ui.path=/swagger-ui.html
